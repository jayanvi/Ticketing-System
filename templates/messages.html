<!DOCTYPE html>
<html>
<head>
    <title>Ticket Messages</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 900px;
            margin: auto;
            padding: 40px;
        }

        .message {
            border: 1px solid #ddd;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 15px;
        }
    </style>
</head>

<body>

    <h1>💬 Ticket Messages</h1>
    <h2>Add a Message</h2>

<form action="/tickets/{{ ticket_id }}/messages/add" method="post">

    <input
        type="text"
        name="author"
        placeholder="Author"
        required
    >

    <input
        type="text"
        name="message_text"
        placeholder="Message"
        required
    >

    <button type="submit">
        Add Message
    </button>

</form>

    {% for message in messages %}

    <div class="message">

        <strong>{{ message.author }}</strong>

        <p>{{ message.message_text }}</p>

        <small>{{ message.created_at }}</small>

    </div>

    {% endfor %}

    <a href="/tickets">← Back to Tickets</a>

</body>
</html>
