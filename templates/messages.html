<!DOCTYPE html>
<html>
<head>
    <title>Ticket Messages</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 900px;
            margin: auto;
            padding: 40px;
        }

        .message {
            border: 1px solid #ddd;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 15px;
        }
    </style>
</head>

<body>

    <h1>💬 Ticket Messages</h1>

    {% for message in messages %}

    <div class="message">

        <strong>{{ message.author }}</strong>

        <p>{{ message.message_text }}</p>

        <small>{{ message.created_at }}</small>

    </div>

    {% endfor %}

    <a href="/tickets">← Back to Tickets</a>

</body>
</html>
