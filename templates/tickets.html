<!DOCTYPE html>
<html>
<head>
    <title>Support Tickets</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 1000px;
            margin: auto;
            padding: 40px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th,
        td {
            border: 1px solid #ddd;
            padding: 12px;
            text-align: left;
        }

        th {
            background: #f5f5f5;
        }

        tr:hover {
            background: #fafafa;
        }

        a {
            text-decoration: none;
        }
    </style>
</head>

<body>

    <h1>🎫 Support Tickets</h1>

    <table>

        <tr>
            <th>ID</th>
            <th>Title</th>
            <th>Status</th>
            <th>Created By</th>
            <th>Created At</th>
        </tr>

        {% for ticket in tickets %}

        <tr>
            <td>{{ ticket.ticket_id }}</td>

            <td>
                <a href="/tickets/{{ ticket.ticket_id }}/messages">
                    {{ ticket.title }}
                </a>
            </td>

            <td>{{ ticket.status }}</td>

            <td>{{ ticket.created_by }}</td>

            <td>{{ ticket.created_at }}</td>
        </tr>

        {% endfor %}

    </table>

    <br>

    <a href="/">← Dashboard</a>

</body>
</html>
